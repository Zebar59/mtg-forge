<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MTG Forge</title>
<style>
:root{--bg:#070707;--panel:#111;--line:#292929;--orange:#ff6a00;--text:#f5f5f5;--muted:#999;--ok:#69d99a;--warn:#ffb45c}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 80% 0,#321505,#070707 55%);color:var(--text);font-family:system-ui,sans-serif}
header{padding:18px 5%;border-bottom:1px solid #292929;font-size:24px;font-weight:900}
header span{color:var(--orange)}
main{max-width:1100px;margin:auto;padding:45px 20px}
.hero{text-align:center;color:var(--muted);margin-bottom:35px}
h1{font-size:clamp(38px,7vw,65px);line-height:1;margin:10px;color:#fff}
h1 span{color:var(--orange)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.box{background:#111;border:1px solid #292929;border-radius:16px;padding:20px}
textarea{width:100%;height:330px;background:#080808;color:#fff;border:1px solid #333;border-radius:10px;padding:14px;font:14px monospace}
button{padding:12px 16px;border-radius:9px;border:0;font-weight:800;margin-top:10px;cursor:pointer}
.primary{background:var(--orange);color:#160900}.secondary{background:#222;color:#fff;border:1px solid #444}
button:disabled{opacity:.4;cursor:not-allowed}
.stats{margin:12px 0;color:var(--ok)}.results{display:grid;gap:9px}
.card{display:flex;align-items:center;gap:12px;background:#090909;border:1px solid #292929;border-radius:10px;padding:8px;cursor:pointer}
.card img{width:62px;height:87px;object-fit:cover;border-radius:5px}
.meta{font-size:12px;color:#888;margin-top:4px}.status{margin-left:auto;font-size:12px;color:var(--ok)}
.note{font-size:12px;color:#777;margin-top:8px}.empty{text-align:center;color:#777;padding:70px 10px}
@media(max-width:800px){.grid{grid-template-columns:1fr}main{padding-top:30px}}

#pdfPrint{display:none}

@media print{
  @page{size:A4 portrait;margin:0}
  html,body{width:210mm;margin:0;background:#fff}
  body{color:#000}
  header,.hero,.inputbox,#pdfbox h2,#pdfbox .stats,#pdfbox .actions,#pdfbox #pdfmsg{display:none!important}
  main{max-width:none;padding:0;margin:0}
  .grid{display:block}
  .box{border:0;padding:0;background:#fff}
  #results{display:none!important}
  #pdfPrint{
    display:grid!important;
    width:210mm;
    min-height:297mm;
    padding:8.5mm 8.5mm;
    grid-template-columns:repeat(3,63mm);
    grid-auto-rows:88mm;
    column-gap:2mm;
    row-gap:2mm;
    align-content:start;
  }
  .print-card{
    width:63mm;height:88mm;
    overflow:hidden;
    break-inside:avoid;
    page-break-inside:avoid;
  }
  .print-card img{
    display:block;width:63mm;height:88mm;
    object-fit:fill;
    image-rendering:auto;
  }
}
</style>
</head>
<body>
<header>⚒ <span>MTG</span> FORGE <small style="float:right;color:#777;font-size:12px">V0.5.1</small></header>

<main>
<section class="hero">
<div>🇫🇷 L'atelier français du proxy</div>
<h1>Prépare ton deck.<br><span>Imprime-le.</span></h1>
<p>Images haute résolution et mise en page A4 optimisée pour l'impression.</p>
</section>

<div class="grid">
<div class="box inputbox">
<h2>📋 Ma decklist</h2>
<textarea id="deck">Commander
1 The Great Goblin

Deck
1 Sol Ring
1 Lightning Bolt
1 Kiki-Jiki, Mirror Breaker
1 Krenko, Mob Boss
1 Skullclamp
2 Mountain
2 Swamp</textarea>
<br>
<button class="primary" id="analyze">⚒ Analyser mon deck</button>
<button class="secondary" id="clear">Effacer</button>
<div class="note">Format : 1 Nom de carte. Commander / Deck facultatifs.</div>
</div>

<div class="box" id="pdfbox">
<h2>🔎 Résultat</h2>
<div id="stats" class="stats"></div>
<div id="results"><div class="empty">Lance l'analyse pour commencer.</div></div>
<div class="actions">
<button class="primary" id="pdf" disabled>🖨️ Préparer le PDF</button>
</div>
<div id="pdfmsg" class="note"></div>
</div>
</div>

<div id="pdfPrint"></div>
</main>

<script>
const $=id=>document.getElementById(id);

function parseDeck(text){
  const cards=new Map();
  for(const raw of text.split(/\r?\n/)){
    const line=raw.trim();
    if(!line || /^(commander|deck|sideboard|companion|maybeboard)$/i.test(line)) continue;
    const m=line.match(/^(\d+)\s*[x×]?\s+(.+)$/);
    if(!m) continue;
    const qty=Number(m[1]);
    const name=m[2]
      .replace(/\s+\([A-Za-z0-9]+\)\s+\d+[A-Za-z-]*$/,'') 
      .replace(/\s+\[[A-Za-z0-9]+\]\s+\d+[A-Za-z-]*$/,'')
      .replace(/\s+\[[A-Za-z0-9]+\]$/,'')
      .trim();
    const key=name.toLowerCase();
    cards.set(key,{name,qty:(cards.get(key)?.qty||0)+qty});
  }
  return [...cards.values()];
}

async function findCard(name){
  const q=encodeURIComponent('!"'+name+'" lang:fr');
  const r=await fetch('https://api.scryfall.com/cards/search?q='+q+'&unique=prints');
  if(r.ok){
    const d=await r.json();
    if(d.data?.length) return d.data[0];
  }
  const exact=await fetch('https://api.scryfall.com/cards/named?exact='+encodeURIComponent(name));
  if(!exact.ok) throw new Error('Carte introuvable');
  return await exact.json();
}

function image(card,size){
  return card.image_uris?.[size] ||
    card.card_faces?.[0]?.image_uris?.[size] ||
    card.image_uris?.small ||
    card.card_faces?.[0]?.image_uris?.small || '';
}

function escapeHtml(value){
  return value.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function analyzeDeck(){
  const cards=parseDeck($('deck').value);
  $('results').innerHTML='';
  $('pdfPrint').innerHTML='';
  $('pdf').disabled=true;
  $('pdfmsg').textContent='';

  if(!cards.length){
    $('stats').textContent='Aucune carte reconnue.';
    $('results').innerHTML='<div class="empty">Vérifie le format : 1 Nom de carte.</div>';
    return;
  }

  let found=0,fr=0,bad=0;

  for(const item of cards){
    const row=document.createElement('div');
    row.className='card';
    row.innerHTML='<div class="pic"></div><div><b>'+escapeHtml(item.qty+' × '+item.name)+'</b><div class="meta">Recherche…</div></div><div class="status">…</div>';
    $('results').append(row);

    try{
      const card=await findCard(item.name);
      found++;
      if(card.lang==='fr') fr++;

      const small=image(card,'small');
      const high=image(card,'png') || image(card,'large');

      if(small){
        const im=document.createElement('img');
        im.src=small; im.alt=item.name; im.loading='lazy';
        row.querySelector('.pic').replaceWith(im);
      }

      row.querySelector('.meta').textContent=(card.set_name||'Édition inconnue')+' • '+(card.lang||'en').toUpperCase();
      row.querySelector('.status').textContent=card.lang==='fr'?'✓ FR':'✓ Trouvée';

      if(high){
        for(let i=0;i<item.qty;i++){
          const pc=document.createElement('div');
          pc.className='print-card';
          const pim=document.createElement('img');
          pim.src=high;
          pim.alt=item.name;
          pc.appendChild(pim);
          $('pdfPrint').appendChild(pc);
        }
      }
    }catch(e){
      bad++;
      row.querySelector('.meta').textContent='Carte non reconnue';
      row.querySelector('.status').textContent='À vérifier';
      row.querySelector('.status').style.color='#ffb45c';
    }

    $('stats').textContent='✓ '+found+' reconnues • 🇫🇷 '+fr+' FR • ⚠ '+bad+' à vérifier';
  }

  if(found>0){
    $('pdf').disabled=false;
    $('pdfmsg').textContent='La version imprimée utilise la meilleure image disponible (PNG haute résolution si disponible).';
  }
}

$('analyze').addEventListener('click',analyzeDeck);

$('pdf').addEventListener('click',()=>{
  if(!$('pdf').disabled){
    window.print();
  }
});

$('clear').addEventListener('click',()=>{
  $('deck').value='';
  $('results').innerHTML='<div class="empty">Lance l’analyse pour commencer.</div>';
  $('pdfPrint').innerHTML='';
  $('stats').textContent='';
  $('pdf').disabled=true;
  $('pdfmsg').textContent='';
});
</script>
</body>
</html>
