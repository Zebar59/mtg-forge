<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MTG Forge</title>
<style>
body{margin:0;background:#070707;color:#eee;font-family:system-ui,sans-serif}
header{padding:18px 5%;border-bottom:1px solid #292929;font-size:24px;font-weight:900}
header span{color:#ff6a00}main{max-width:1100px;margin:auto;padding:45px 20px}
h1{text-align:center;font-size:clamp(38px,7vw,65px);line-height:1;margin:10px}h1 span{color:#ff6a00}
.hero{text-align:center;color:#999;margin-bottom:35px}.hero b{color:#ff6a00}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.box{background:#111;border:1px solid #292929;border-radius:16px;padding:20px}
textarea{width:100%;height:330px;background:#080808;color:white;border:1px solid #333;border-radius:10px;padding:14px;box-sizing:border-box;font:14px monospace}
button{padding:12px 16px;border-radius:9px;border:0;font-weight:800;margin-top:10px;cursor:pointer}.primary{background:#ff6a00}.secondary{background:#222;color:white;border:1px solid #444}
.stats{margin:12px 0;color:#69d99a}.results{display:grid;gap:9px}.card{display:flex;align-items:center;gap:12px;background:#090909;border:1px solid #292929;border-radius:10px;padding:8px;cursor:pointer}
.card img{width:62px;height:87px;object-fit:cover;border-radius:5px}.meta{font-size:12px;color:#888;margin-top:4px}.status{margin-left:auto;font-size:12px;color:#69d99a}
#pdf:disabled{opacity:.4;cursor:not-allowed}.note{font-size:12px;color:#777;margin-top:8px}.empty{text-align:center;color:#777;padding:70px 10px}
#modal{display:none;position:fixed;inset:0;background:#000d;align-items:center;justify-content:center;z-index:9}#modal.show{display:flex}#modal img{max-width:90%;max-height:85%;border-radius:12px}
@media(max-width:800px){.grid{grid-template-columns:1fr}main{padding-top:30px}}
@media print{
 body{background:white;color:black}header,.hero,.inputbox,#pdfbox h2,#pdfbox .stats,#pdfbox button,#pdfbox #pdfmsg{display:none!important}
 main{padding:0}.grid{display:block}.box{border:0;padding:0;background:white}
 #results{display:grid;grid-template-columns:repeat(3,1fr);gap:0}.card{border:0;border-radius:0;padding:0;break-inside:avoid}
 .card img{width:100%;height:auto;border-radius:0}.card div:not(.status){display:none}.status{display:none}
}
</style>
</head>
<body>
<header>⚒ <span>MTG</span> FORGE <small style="float:right;color:#777;font-size:12px">V0.4</small></header>
<main>
<section class="hero"><div>🇫🇷 L'atelier français du proxy</div><h1>Prépare ton deck.<br><span>Imprime-le.</span></h1><p>Colle ta decklist et MTG Forge reconnaît tes cartes.</p></section>
<div class="grid">
<div class="box inputbox">
<h2>📋 Ma decklist</h2>
<textarea id="deck">Commander
1 The Great Goblin

Deck
1 Sol Ring
1 Lightning Bolt
1 Kiki-Jiki, Mirror Breaker
1 Krenko, Mob Boss
1 Skullclamp
2 Mountain
2 Swamp</textarea>
<br><button class="primary" id="analyze">⚒ Analyser mon deck</button>
<button class="secondary" id="clear">Effacer</button>
<div class="note">Format : 1 Nom de carte. Commander / Deck facultatifs.</div>
</div>
<div class="box" id="pdfbox">
<h2>🔎 Résultat</h2><div id="stats" class="stats"></div>
<div id="results"><div class="empty">Lance l'analyse pour commencer.</div></div>
<button class="primary" id="pdf" disabled>🖨️ Générer / imprimer le PDF</button>
<div id="pdfmsg" class="note"></div>
</div>
</div>
</main>
<div id="modal"><img id="large"></div>
<script>
const $=x=>document.getElementById(x);
function esc(x){return x.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function parse(t){let m=new Map;for(let l of t.split(/\\n/)){l=l.trim();if(!l||/^(commander|deck|sideboard|companion|maybeboard)$/i.test(l))continue;let x=l.match(/^(\\d+)\\s*[x×]?\\s+(.+)$/);if(x){let n=x[2].trim(),k=n.toLowerCase();m.set(k,{name:n,qty:(m.get(k)?.qty||0)+Number(x[1])})}}return[...m.values()]}
async function card(n){let q=encodeURIComponent('!"'+n+'" lang:fr'),r=await fetch('https://api.scryfall.com/cards/search?q='+q+'&unique=prints');if(r.ok){let d=await r.json();if(d.data?.length)return d.data[0]}let r2=await fetch('https://api.scryfall.com/cards/named?exact='+encodeURIComponent(n));if(!r2.ok)throw 0;return r2.json()}
function image(d,s){return d.image_uris?.[s]||d.card_faces?.[0]?.image_uris?.[s]||d.image_uris?.small||d.card_faces?.[0]?.image_uris?.small}
async function analyze(){let cs=parse($('deck').value),ok=0,fr=0,bad=0;$('results').innerHTML='';$('pdf').disabled=true;for(let c of cs){let row=document.createElement('div');row.className='card';row.innerHTML='<div class="pic"></div><div><b>'+esc(c.qty+' × '+c.name)+'</b><div class="meta">Recherche…</div></div><div class="status">…</div>';$('results').append(row);try{let d=await card(c.name),src=image(d,'small');ok++;if(d.lang==='fr')fr++;if(src){let im=document.createElement('img');im.src=src;im.alt=c.name;row.querySelector('.pic').replaceWith(im);row.onclick=()=>{if(image(d,'large')){$('large').src=image(d,'large');$('modal').style.display='flex'}}}row.querySelector('.meta').textContent=(d.set_name||'')+' • '+(d.lang||'en').toUpperCase();row.querySelector('.status').textContent=d.lang==='fr'?'✓ FR':'✓ Trouvée'}catch(e){bad++;row.querySelector('.meta').textContent='Carte non reconnue';row.querySelector('.status').textContent='À vérifier';row.querySelector('.status').style.color='#ffb45c'}$('stats').textContent='✓ '+ok+' reconnues • 🇫🇷 '+fr+' FR • ⚠ '+bad+' à vérifier'}if(ok)$('pdf').disabled=false}
$('analyze').onclick=analyze;
$('pdf').onclick=()=>{if(!$('pdf').disabled){$('pdfmsg').textContent='Choisis « Enregistrer en PDF » dans la fenêtre d’impression.';setTimeout(()=>window.print(),150)}};
$('clear').onclick=()=>{$('deck').value='';$('results').innerHTML='<div class="empty">Lance l’analyse pour commencer.</div>';$('stats').textContent='';$('pdf').disabled=true};
$('modal').onclick=()=>{$('modal').style.display='none'};
</script>
</body>
</html>
